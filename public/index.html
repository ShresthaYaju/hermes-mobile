<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="description" content="A private mobile control surface for Hermes Agent." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Hermes</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">H</span><span>Hermes</span></div>
        <span id="connection" class="connection connection--idle" aria-live="polite">connecting</span>
      </header>

      <main id="outlet" class="outlet"></main>

      <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
    </div>
    <noscript>This app needs JavaScript to reach your Hermes agent.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
