name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor: `node --test 'glob'` expands the pattern itself.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # node --check over every module, then prettier --check. The import graph
      # is walked by test/imports.test.mjs, not here.
      - name: Check syntax and formatting
        run: npm run check

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # This proxy fronts an agent with shell access, so a vulnerable transitive
      # dependency is not a papercut. The tree is deliberately tiny; keep it clean.
      - run: npm audit --audit-level=moderate
